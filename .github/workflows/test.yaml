name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27' 'setuptools>=83'
      - run: pip install ruff==0.16.8
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: |
          for script in install-local.sh uninstall-local.sh scripts/install.sh bin/valuetrace; do
            sh -n "$script"
          done
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
        helm: ['v3.21.4', 'v4.3.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install checksum-verified Helm
        env:
          HELM_VERSION: ${{ matrix.helm }}
        run: |
          mkdir -p "$RUNNER_TEMP/helm"
          cd "$RUNNER_TEMP/helm"
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 "https://get.helm.sh/$archive" -o "$archive"
          curl --fail --location --retry 3 "https://get.helm.sh/$archive.sha256sum" -o "$archive.sha256sum"
          sha256sum --check "$archive.sha256sum"
          tar -xzf "$archive" linux-amd64/helm
          echo "$RUNNER_TEMP/helm/linux-amd64" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade 'pip>=26.2,<27' 'setuptools>=83'
      - run: pip install -r requirements.txt pytest build setuptools wheel
      - run: python -m compileall -q src tests
      - name: Full suite including differential and installer tests
        run: HELM_BIN="$(command -v helm)" PYTHONPATH=src python -m pytest
      - name: Local install, repeat upgrade and uninstall
        run: |
          ./install-local.sh
          ./install-local.sh
          helm valuetrace --version
          helm valuetrace examples/layered/chart -f examples/layered/production.yaml --explain image.tag
          ./uninstall-local.sh
